[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Multi-agent RAG system for enterprise documentation (Manager + Qualitative RAG + Quantitative NL-to-SQL agents)"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
enterprise-rag = "enterprise_rag.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
